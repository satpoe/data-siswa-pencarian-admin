<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Data Siswa - SDIT An-Nahl</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f7f5;color:#24332d}header{background:#176b52;color:white;padding:38px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px}h1{margin:0 0 10px;text-align:center;font-size:30px;letter-spacing:.3px}.wrap{max-width:1050px;margin:24px auto;padding:0 15px}.card{background:white;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 3px 16px #0001}button{border:0;border-radius:8px;padding:11px 16px;background:#176b52;color:white;cursor:pointer;font-weight:bold}button.gray{background:#68756f}button.red{background:#b42318}button.small{padding:7px 10px;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #d7e0dc;border-radius:8px;margin:5px 0 12px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;background:#edf7f2;border-radius:10px}.stat b{font-size:22px;display:block;color:#176b52}.hidden{display:none}.error{display:none;background:#fff0f0;color:#a61b1b;padding:11px;border-radius:8px;margin:12px 0}.ok{display:none;background:#edf9f3;color:#176b52;padding:11px;border-radius:8px;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.badge{display:inline-block;background:#e5f3ed;color:#176b52;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.photo{width:110px;height:110px;border-radius:12px;object-fit:cover;background:#e7eeeb}.notice{padding:12px;border-left:4px solid #176b52;background:#f5faf8;margin:8px 0}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🏫 Data Siswa</h1><div>SDIT AN-NAHL SERI KUALA LOBAM</div></header><div class="wrap">
<div id="home" class="card" style="text-align:center"><h2>Selamat Datang</h2><p>Silakan pilih akses.</p><div class="actions" style="justify-content:center"><button onclick="show('wali')">🔎 Pencarian</button><button onclick="show('login')">👨‍🏫 Admin</button></div></div>
<div id="wali" class="card hidden"><button class="gray" onclick="show('home')">← Kembali</button><h2>Pencarian</h2><p>Masukkan nama anak dan PIN dari sekolah.</p><input id="wnama" placeholder="Nama lengkap anak"><input id="wpin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="waliLogin()">Lihat Data Anak</button><div id="we" class="error"></div><div id="wresult"></div></div>
<div id="login" class="card hidden"><button class="gray" onclick="show('home')">← Kembali</button><h2>Login Admin</h2><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button onclick="adminLogin()">Login</button><div id="le" class="error"></div></div>
<div id="admin" class="card hidden"><div class="actions"><button onclick="logout()">Keluar</button><button class="gray" onclick="loadAdmin()">↻ Refresh</button></div><h2>👨‍🏫 Dashboard Admin</h2>
<div class="stats"><div class="stat"><b id="total">0</b>Total Siswa</div><div class="stat"><b id="laki">0</b>Laki-laki</div><div class="stat"><b id="perempuan">0</b>Perempuan</div><div class="stat"><b id="kelascount">0</b>Kelas</div></div>
<hr><h3>Data Siswa</h3><input id="search" oninput="renderStudents()" placeholder="🔎 Cari nama, NISN, atau kelas..."><div id="list">Memuat...</div>
<hr><h3 id="formtitle">➕ Tambah / Edit Siswa</h3><input type="hidden" id="sid"><div class="grid">
<div><label>Nama *</label><input id="nama"><label>NISN</label><input id="nisn"><label>Kelas</label><input id="kelas"><label>Jenis Kelamin</label><select id="jk"><option>Laki-laki</option><option>Perempuan</option></select><label>PIN Wali *</label><input id="pin" inputmode="numeric"></div>
<div><label>Tempat/Tanggal Lahir</label><input id="ttl"><label>Alamat</label><input id="alamat"><label>Nama Ayah</label><input id="ayah"><label>Nama Ibu</label><input id="ibu"></div></div>
<div class="grid"><div><label>Nilai Rata-rata</label><input id="nilai" type="number"><label>Hadir</label><input id="hadir" type="number" value="0"><label>Sakit</label><input id="sakit" type="number" value="0"></div><div><label>Izin</label><input id="izin" type="number" value="0"><label>Alpa</label><input id="alpa" type="number" value="0"><label>Catatan Wali Kelas</label><textarea id="catatan" rows="4"></textarea></div></div>
<div class="actions"><button onclick="saveStudent()">💾 Simpan</button><button class="gray" onclick="clearForm()">Bersihkan</button></div><div id="ae" class="error"></div><div id="ok" class="ok"></div>
</div></div><script>
const db=window.supabase.createClient("https://uepbvyzqrhhvgzktxkmg.supabase.co","sb_publishable_WBsGgAeaYivEAv7xL7qF_A_ilXHg2X-");let students=[];
const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),num=id=>v(id)===''?0:Number(v(id));
function safe(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){['home','wali','login','admin'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='admin')loadAdmin()}
async function waliLogin(){let e=$('we'),r=$('wresult');e.style.display='none';r.innerHTML='';let name=v('wnama'),pin=v('wpin');if(!name||!pin){e.style.display='block';e.textContent='Nama dan PIN wajib diisi.';return}let {data,error}=await db.rpc('cari_data_wali',{p_nama:name,p_pin:pin});let x=data&&data[0];if(error||!x){e.style.display='block';e.textContent='Nama atau PIN salah.';return}r.innerHTML=`<div class="card"><div class="grid"><div><h2>👦 ${safe(x.nama)}</h2><span class="badge">${safe(x.kelas)}</span><p><b>NISN:</b> ${safe(x.nisn)}</p><p><b>Jenis Kelamin:</b> ${safe(x.jk)}</p><p><b>TTL:</b> ${safe(x.ttl)}</p><p><b>Alamat:</b> ${safe(x.alamat)}</p><p><b>Ayah:</b> ${safe(x.ayah)}</p><p><b>Ibu:</b> ${safe(x.ibu)}</p></div><div>${x.foto?`<img class="photo" src="${safe(x.foto)}">`:''}<h3>📊 Nilai & Kehadiran</h3><p><b>Nilai rata-rata:</b> ${safe(x.nilai)}</p><p>Hadir: ${safe(x.hadir)} • Sakit: ${safe(x.sakit)} • Izin: ${safe(x.izin)} • Alpa: ${safe(x.alpa)}</p><h3>📝 Catatan</h3><p>${safe(x.catatan||'-')}</p></div></div></div>`;loadNotices('wresult')}
async function adminLogin(){let {error}=await db.auth.signInWithPassword({email:v('email'),password:$('password').value});if(error){$('le').style.display='block';$('le').textContent=error.message;return}$('le').style.display='none';show('admin')}
async function logout(){await db.auth.signOut();show('home')}
async function loadAdmin(){let {data,error}=await db.from('siswa').select('*').order('nama');if(error){$('list').innerHTML='<div class="error" style="display:block">'+safe(error.message)+'</div>';return}students=data||[];renderStudents();updateStats()}
function renderStudents(){let q=v('search').toLowerCase(),a=students.filter(s=>(s.nama||'').toLowerCase().includes(q)||(s.nisn||'').toLowerCase().includes(q)||(s.kelas||'').toLowerCase().includes(q));$('list').innerHTML='<table><tr><th>No</th><th>Nama</th><th>NISN</th><th>Kelas</th><th>Aksi</th></tr>'+a.map((s,i)=>`<tr><td>${i+1}</td><td>${safe(s.nama)}</td><td>${safe(s.nisn)}</td><td>${safe(s.kelas)}</td><td><button class="small" onclick="editStudent(${s.id})">Edit</button> <button class="small red" onclick="deleteStudent(${s.id})">Hapus</button></td></tr>`).join('')+'</table>'}
function updateStats(){$('total').textContent=students.length;$('laki').textContent=students.filter(x=>x.jk==='Laki-laki').length;$('perempuan').textContent=students.filter(x=>x.jk==='Perempuan').length;$('kelascount').textContent=new Set(students.map(x=>x.kelas).filter(Boolean)).size}
function clearForm(){['sid','nama','nisn','kelas','pin','ttl','alamat','ayah','ibu','nilai','hadir','sakit','izin','alpa','catatan'].forEach(id=>$(id).value='');['hadir','sakit','izin','alpa'].forEach(id=>$(id).value=0);$('formtitle').textContent='➕ Tambah / Edit Siswa'}
function editStudent(id){let s=students.find(x=>x.id===id);if(!s)return;['sid','nama','nisn','kelas','jk','pin','ttl','alamat','ayah','ibu','nilai','hadir','sakit','izin','alpa','catatan'].forEach(id=>{if(s[id]!==undefined)$(id).value=s[id]??''});$('formtitle').textContent='✏️ Edit Data: '+s.nama;scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function saveStudent(){let p={nama:v('nama'),nisn:v('nisn'),kelas:v('kelas'),jk:v('jk'),pin:v('pin'),ttl:v('ttl'),alamat:v('alamat'),ayah:v('ayah'),ibu:v('ibu'),nilai:num('nilai'),hadir:num('hadir'),sakit:num('sakit'),izin:num('izin'),alpa:num('alpa'),catatan:v('catatan')};if(!p.nama||!p.pin){$('ae').style.display='block';$('ae').textContent='Nama dan PIN wajib diisi.';return}let id=v('sid'),res=id?await db.from('siswa').update(p).eq('id',id):await db.from('siswa').insert(p);if(res.error){$('ae').style.display='block';$('ae').textContent=res.error.message;return}$('ae').style.display='none';$('ok').style.display='block';$('ok').textContent='Data berhasil disimpan online.';clearForm();loadAdmin()}
async function deleteStudent(id){if(!confirm('Hapus data siswa ini?'))return;let {error}=await db.from('siswa').delete().eq('id',id);if(error)alert(error.message);else loadAdmin()}
</script></body></html>
